services:
  - type: web
    name: citation-renumberer
    runtime: python
    plan: free # stateless -- uploads/exports are transient, nothing to persist
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
